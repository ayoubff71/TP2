<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>calculator</title>
</head>
<body>
    <div class="container">
        <div class="secContainer">
            <div class="firstB">
            <input type="text" id="screen">
        </div>
        <div class="numbers">
            <button type="button" id="clear">C</button>
            <button type="button" id="effacer">effacer</button>
            <button type="button" id="division">/</button>
            <button type="button" id="multiple" style="background-color: rgb(248, 145, 48);">*</button>
            <button type="button" id="seven" value="7">7</button>
            <button type="button" id="eight" value="8">8</button>
            <button type="button" id="nine" value="9">9</button>
            <button type="button" id="minus" style="background-color: rgb(248, 145, 48);">-</button>
            <button type="button" id="four" value="4">4</button>
            <button type="button" id="five" value="5">5</button>
            <button type="button" id="six" value="6">6</button>
            <button type="button" id="plus" style="background-color: rgb(248, 145, 48);">+</button>
            <button type="button" id="one" value="1">1</button>
            <button type="button" id="two" value="2">2</button>
            <button type="button" id="three" value="3">3</button>
            <button type="button" id="equal" style="background-color: rgb(248, 145, 48);">=</button>
            <button type="button" id="zero" value="0">0</button>
            <button type="button" id="virgul">.</button>
            
        </div>
        </div>
        
    </div>

    <script src="index.js"></script>
</body>
</html>
